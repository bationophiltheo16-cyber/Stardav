<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>RF GROUPE — Structure Événementielle</title>
<meta name="description" content="RF GROUPE — Organisation d'événements, booking artistique, logistique, création digitale et impression à Ouagadougou. Votre vision, par notre organisation.">
<meta name="theme-color" content="#0A0A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --black:#08090a;
    --black-2:#111214;
    --red-deep:#3d0000;
    --red:#a30f16;
    --red-bright:#e21f26;
    --white:#f7f6f4;
    --grey:#9a9a9f;
    --grey-dim:#5c5d61;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background:var(--black);
    color:var(--white);
    font-family:'Inter',sans-serif;
    overflow-x:hidden;
  }
  ::selection{background:var(--red-bright);color:#fff;}

  .display{font-family:'Anton',sans-serif;font-weight:400;text-transform:uppercase;letter-spacing:0.01em;}
  .script{font-family:'Caveat',cursive;font-weight:700;}

  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1160px;margin:0 auto;padding:0 24px;}

  .rig-bg{
    position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 15% 8%, rgba(226,31,38,0.16), transparent 40%),
      radial-gradient(circle at 85% 15%, rgba(226,31,38,0.10), transparent 45%),
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0px, rgba(255,255,255,0.025) 1px, transparent 1px, transparent 64px);
  }

  header{
    position:fixed;top:0;left:0;right:0;z-index:50;
    background:rgba(8,9,10,0.85);
    backdrop-filter:blur(10px);
    border-bottom:1px solid rgba(255,255,255,0.08);
  }
  .nav{display:flex;align-items:center;justify-content:space-between;padding:14px 24px;max-width:1160px;margin:0 auto;}
  .logo{display:flex;align-items:baseline;gap:8px;}
  .logo .rf{font-family:'Anton',sans-serif;font-size:22px;letter-spacing:0.02em;}
  .logo .g{font-size:11px;color:var(--grey);letter-spacing:0.18em;}
  .nav-cta{
    background:var(--red-bright);color:#fff;font-weight:700;font-size:13px;
    padding:9px 18px;border-radius:2px;letter-spacing:0.03em;
    border:1px solid var(--red-bright);
    transition:background .2s, color .2s;
  }
  .nav-cta:hover{background:transparent;color:var(--red-bright);}

  .hero{
    position:relative;z-index:1;
    min-height:100svh;
    display:flex;flex-direction:column;justify-content:center;
    padding:120px 24px 70px;
  }
  .star{
    position:absolute;
    stroke:rgba(255,255,255,0.14);
    fill:none;
    stroke-width:1.4;
  }
  .star.s1{width:130px;top:14%;right:6%;animation:spin 40s linear infinite;}
  .star.s2{width:70px;bottom:10%;left:4%;animation:spin 30s linear infinite reverse;}
  @keyframes spin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  .beam{
    position:absolute;top:-10%;width:2px;height:70%;
    background:linear-gradient(180deg, rgba(226,31,38,0.5), transparent 80%);
    filter:blur(1px);
    animation:sweep 7s ease-in-out infinite;
    transform-origin:top center;
  }
  .beam.b1{left:22%;animation-delay:0s;}
  .beam.b2{left:50%;animation-delay:1.4s;}
  .beam.b3{left:74%;animation-delay:2.8s;}
  @keyframes sweep{
    0%,100%{transform:rotate(-6deg);opacity:.35;}
    50%{transform:rotate(6deg);opacity:.75;}
  }
  @media (prefers-reduced-motion: reduce){
    .star,.beam{animation:none;}
  }

  .eyebrow{
    color:var(--red-bright);font-weight:700;font-size:12.5px;
    letter-spacing:0.22em;margin-bottom:18px;
  }
  .h1{
    font-size:clamp(52px,13vw,108px);
    line-height:0.92;
    color:#fff;
  }
  .ribbon{
    display:inline-block;margin-top:18px;
    background:linear-gradient(90deg, var(--red-deep), var(--red));
    color:#fff;font-family:'Anton',sans-serif;
    font-size:clamp(20px,4.4vw,30px);
    padding:10px 20px;
    box-shadow:4px 4px 0 rgba(0,0,0,0.4);
  }
  .hero-sub{
    margin-top:28px;max-width:520px;
    color:var(--grey);font-size:16px;line-height:1.6;
  }
  .hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:36px;}
  .btn-primary{
    background:var(--red-bright);color:#fff;font-weight:700;font-size:14.5px;
    padding:15px 26px;border-radius:2px;letter-spacing:0.02em;
    display:inline-flex;align-items:center;gap:10px;
    box-shadow:0 0 0 1px var(--red-bright);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  .btn-primary:hover{transform:translateY(-2px);box-shadow:0 8px 20px -6px rgba(226,31,38,0.6);}
  .btn-ghost{
    border:1px solid rgba(255,255,255,0.25);color:#fff;font-weight:600;font-size:14.5px;
    padding:14px 24px;border-radius:2px;
    transition:border-color .2s, background .2s;
  }
  .btn-ghost:hover{border-color:#fff;background:rgba(255,255,255,0.06);}

  .signature{
    margin-top:56px;
    font-family:'Caveat',cursive;font-weight:700;
    font-size:clamp(22px,4vw,30px);
    color:var(--red-bright);
  }

  .events-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:22px;}
  .event-card{
    border:1px solid rgba(255,255,255,0.1);
    background:linear-gradient(160deg, var(--black-2), #0c0708 130%);
    overflow:hidden;display:flex;flex-direction:column;
    transition:border-color .2s, transform .2s;
  }
  .event-card:hover{border-color:var(--red-bright);transform:translateY(-3px);}
  .event-img{
    width:100%;aspect-ratio:16/10;object-fit:cover;
    background:linear-gradient(135deg,#1a0d0d,#0c0708);
  }
  .event-body{padding:22px 22px 24px;display:flex;flex-direction:column;gap:10px;flex:1;}
  .event-date{
    color:var(--red-bright);font-weight:700;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;
  }
  .event-title{font-family:'Anton',sans-serif;font-size:21px;text-transform:uppercase;line-height:1.15;}
  .event-loc{color:var(--grey);font-size:13.5px;}
  .event-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:14px;}
  .event-price{font-weight:800;font-size:17px;}
  .event-price small{color:var(--grey-dim);font-weight:500;font-size:11.5px;}
  .btn-event{
    background:var(--red-bright);color:#fff;font-weight:700;font-size:13px;
    padding:10px 16px;border-radius:2px;white-space:nowrap;
    transition:background .2s;
  }
  .btn-event:hover{background:var(--red);}
  .events-empty{color:var(--grey);font-size:14.5px;border:1px dashed rgba(255,255,255,0.15);padding:30px;text-align:center;}
  .events-loading{color:var(--grey-dim);font-size:14px;}

  section{position:relative;z-index:1;padding:90px 0;}
  .kicker{color:var(--red-bright);font-weight:700;font-size:12px;letter-spacing:0.2em;margin-bottom:10px;}
  .h2{font-family:'Anton',sans-serif;font-size:clamp(30px,5.6vw,48px);text-transform:uppercase;margin-bottom:16px;}
  .section-intro{color:var(--grey);max-width:560px;font-size:15.5px;line-height:1.7;margin-bottom:56px;}

  .services-grid{
    display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
    gap:1px;background:rgba(255,255,255,0.08);
    border:1px solid rgba(255,255,255,0.08);
  }
  .service-card{
    background:linear-gradient(160deg, var(--black-2), #0c0708 120%);
    padding:34px 30px
